<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudGPT — Cloud AI Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">☁ CloudGPT</div>
    <button id="new-chat" class="new-chat">＋ New chat</button>
    <p class="workspace">Your AI workspace</p>
    <p class="sidebar-footer">Built with Python, Gemini, Docker and AWS.</p>
  </aside>
  <main class="main">
    <header class="topbar"><span>CloudGPT</span><span class="status">AI Assistant</span></header>
    <section id="messages" class="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>How can I help with cloud computing?</h1>
        <p>Ask about AWS, Docker, DevOps, networking, Python, or deployment.</p>
        <div class="suggestions">
          <button class="suggestion">Explain AWS EC2 in simple words</button>
          <button class="suggestion">How do I deploy an app with Docker?</button>
          <button class="suggestion">What is the difference between S3 and EBS?</button>
        </div>
      </div>
    </section>
    <form id="chat-form" class="composer">
      <textarea id="message-input" rows="1" placeholder="Message CloudGPT..." aria-label="Message CloudGPT" required></textarea>
      <button id="send-button" type="submit" aria-label="Send message">↑</button>
    </form>
    <p class="footnote">CloudGPT can make mistakes. Verify important technical commands before using them.</p>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
